<main class="flex">

  <div>
    <app-sidebar></app-sidebar>
  </div>

  <div class="main-content w-full flex flex-wrap justify-center items-start">

    <div class="flex flex-wrap justify-between w-full">

      <h1 class="w-fit font-bold text-3xl">Lista de departamentos</h1>

      <button class="p-10 text-lg bg-yellow-400 ">
        Agregar marca
      </button>

    </div>

    <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre del Departamento</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let departamento of departamentos">
            <td>{{ departamento.id }}</td>
            <td>{{ departamento.nombreDepartamento }}</td>
            <td>
              <button (click)="editarDepartamento(departamento.id)">Editar</button>
              <button (click)="deleteDepartamento(departamento.id)">Eliminar</button>
            </td>
          </tr>
        </tbody>
      </table>
  </div>



</main>
