<main class="grid grid-cols-12">
    
    <div class="col-span-3 h-full">
        <app-sidebar></app-sidebar>
    </div>

    <div class="main-content col-span-9 h-full">
        <div class="content-wrapper">
            <div class="flex justify-around">
                <h1 class="title">Gestión de Productos</h1>

                <!-- <button class="p-2 rounded-lg h-fit text-lg bg-yellow-400 " routerLink="/marcaForm">
                    Agregar producto
                </button> -->
            </div>


            <div class="table-container">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Precio</th>
                            <th>Categoría</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let product of products">
                            <td>{{ product.id }}</td>
                            <td>{{ product.nombre }}</td>
                            <td>{{ product.precio | currency }}</td>
                            <td class="category-cell">{{ product.categoria }}</td>
                            <td class="actions">
                                <button class="btn btn-edit" (click)="editarProducto(product.id)"
                                    aria-label="Editar Producto">
                                    <i class="fas fa-edit"></i> Editar
                                </button>
                                <button class="btn btn-delete" (click)="eliminarProducto(product.id)"
                                    aria-label="Eliminar Producto">
                                    <i class="fas fa-trash-alt"></i> Eliminar
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    
</main>
