<div class="main-content">
  <div class="header">
    <h2>Lista de Categorías</h2>
    <button routerLink="/categoriaForm" class="add-btn">Agregar Categoría</button>
  </div>
  
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let categoria of categorias">
        <td>{{ categoria.id }}</td>
        <td>{{ categoria.nombrecategoria }}</td>
        <td>{{ categoria.descripcion }}</td>
        <td class="actions">
          <button [routerLink]="['/categoriaForm', categoria.id]" class="edit-btn">Editar</button>
          <button (click)="eliminarCategoria(categoria.id)" class="delete-btn">Eliminar</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
<app-sidebar></app-sidebar>
