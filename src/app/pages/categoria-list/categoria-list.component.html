<h2>Lista de Categorías</h2>
<button routerLink="/categorias/nueva">Agregar Categoría</button>
<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Descripción</th>
      <th>Acciones</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let categoria of categorias">
      <td>{{ categoria.id }}</td>
      <td>{{ categoria.nombreCategoria }}</td>
      <td>{{ categoria.descripcion }}</td>
      <td>
        <button [routerLink]="['/categoriaForm', categoria.id]">Editar</button>
        <button (click)="eliminarCategoria(categoria.id)">Eliminar</button>
      </td>
    </tr>
  </tbody>
</table>

<app-sidebar></app-sidebar>
