<div class="main-content">
    <div class="container">
        <h2>{{ id ? 'Editar Usuario' : 'Crear Usuario' }}</h2>
        <form [formGroup]="usuarioForm" (ngSubmit)="guardarUsuario()">
          <div>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" formControlName="nombre" required />
          </div>
      
          <div>
            <label for="email">Correo Electrónico:</label>
            <input type="email" id="email" formControlName="email" required />
          </div>
      
          <div *ngIf="!id">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" formControlName="password" required />
          </div>
      
          <div>
            <label for="rol">Rol:</label>
            <select id="rol" formControlName="rol" required>
              <option value="admin">Administrador</option>
              <option value="usuario">Usuario</option>
            </select>
          </div>
      
          <button type="submit" [disabled]="usuarioForm.invalid">Guardar</button>
          <button type="button" (click)="cancelar()">Cancelar</button>
        </form>
      </div>
</div>
