<div class="main-content">
  <form [formGroup]="categoriaForm" (ngSubmit)="guardarCategoria()">
    <h2>{{ id ? 'Editar' : 'Nueva' }} Categoría</h2>
    
    <label>Nombre:</label>
    <input type="text" formControlName="nombrecategoria" required>
    
    <label>Descripción:</label>
    <textarea formControlName="descripcion" required></textarea>
    
    <button class="save">Guardar</button>
    <button class="cancel">
      <a routerLink="/categorias">Cancelar</a>
    </button>
  </form>
</div>
<app-sidebar></app-sidebar>
